[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI: An end-to-end AI Agent Factory for ingesting domain corpora, forging evaluated tool-using agents, and serving them via API, CLI, and UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ForgeAI Contributors" }]
dependencies = [
    "beautifulsoup4==4.14.3",
    "click==8.3.1",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pypdf==6.16.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "PyYAML==6.0.3",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
ui = [
    "streamlit==1.67.0",
]
dev = [
    "mypy==2.4.1",
    "pytest==9.0.2",
    "ruff==0.17.6",
]

[project.scripts]
forgeai = "forgeai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"
