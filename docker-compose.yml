services:
  api:
    image: forgeai:local
    build: .
    container_name: forgeai-api
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      FORGEAI_API_HOST: 0.0.0.0
      FORGEAI_API_PORT: 8000
      FORGEAI_RUN_EMBEDDED_WORKER: "false"
      FORGEAI_DB_PATH: /app/data/forgeai.db
      FORGEAI_ARTIFACTS_DIR: /app/data/artifacts
      FORGEAI_OLLAMA_BASE_URL: ${FORGEAI_OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    volumes:
      - forgeai_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: forgeai:local
    build: .
    container_name: forgeai-worker
    command: ["python", "-m", "forgeai.service.jobs"]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      FORGEAI_DB_PATH: /app/data/forgeai.db
      FORGEAI_ARTIFACTS_DIR: /app/data/artifacts
      FORGEAI_OLLAMA_BASE_URL: ${FORGEAI_OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - forgeai_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sqlite3; conn = sqlite3.connect('/app/data/forgeai.db', timeout=2); conn.execute('SELECT 1'); conn.close()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    image: forgeai:local
    build: .
    container_name: forgeai-ui
    command:
      [
        "streamlit",
        "run",
        "ui/app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
        "--server.headless=true",
      ]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      FORGEAI_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional local LLM service: start with `docker compose --profile ollama up --build`
  ollama:
    image: ollama/ollama:0.6.2
    container_name: forgeai-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  forgeai_data:
  ollama_models:
