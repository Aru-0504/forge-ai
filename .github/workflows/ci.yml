name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ForgeAI and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests ui

      - name: Type-check with Mypy
        run: mypy src

      - name: Run Unit & Integration Tests (stubbed model)
        env:
          FORGEAI_LLM_PROVIDER: stub
        run: pytest -v

      - name: Verify Demo Artifacts Load Cleanly
        run: |
          forgeai inspect demos/run1_hr_policy
          forgeai inspect demos/run2_ship_spares
